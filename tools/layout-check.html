<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Woodshed layout check</title>
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; background: #111; color: #eee; }
  #out { white-space: pre-wrap; padding: 12px; font-family: ui-monospace, monospace; }
  #stage { position: absolute; left: -10000px; top: 0; }
  iframe { border: 0; display: block; background: #000; }
</style>
</head>
<body>
<div id="out">Running…</div>
<div id="stage"></div>
<script>
// Loads Woodshed in an iframe at several viewport sizes, visits each view and reports layout problems:
// page-level horizontal scroll, elements running off the viewport, text clipped inside its box, overlapping
// buttons, tiny touch targets on phones. Serve this folder's parent (the app) and open /tools/layout-check.html.
// Results: window.__layoutResults (also printed). ?routes=a,b and ?sizes=1440x900,390x844 narrow the run.
const params = new URLSearchParams(location.search);
const SIZES = (params.get('sizes') || '1920x1080,1440x900,1280x720,1024x768,768x1024,390x844')
  .split(',').map((s) => s.split('x').map(Number));
const ROUTES = (params.get('routes') || 'library,import,tuner,settings,PLAY,LEARN,SYNC').split(',');

function describe(el) {
  const id = el.id ? '#' + el.id : '';
  const cls = typeof el.className === 'string' && el.className.trim()
    ? '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.') : '';
  const txt = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 30);
  return `${el.tagName.toLowerCase()}${id}${cls}${txt ? ` "${txt}"` : ''}`;
}

function audit(win, w, h) {
  const doc = win.document;
  const issues = [];
  const root = doc.scrollingElement || doc.documentElement;
  if (root.scrollWidth > w + 1) issues.push(`page scrolls sideways (${root.scrollWidth}px wide)`);
  const all = [...doc.querySelectorAll('body *')];
  const visible = (el) => {
    const cs = win.getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity === 0) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  };
  // Is the element inside something that scrolls/clips horizontally on purpose (wide tables, the highway)?
  const inScroller = (el) => {
    for (let p = el.parentElement; p && p !== doc.body; p = p.parentElement) {
      const cs = win.getComputedStyle(p);
      if (/(auto|scroll|hidden|clip)/.test(cs.overflowX)) return true;
    }
    return false;
  };
  let offRight = 0, clipped = 0, overlaps = 0, tiny = 0;
  const offList = [], clipList = [], overList = [], tinyList = [];
  for (const el of all) {
    if (el.closest('#yt-holder, canvas, svg, .toast-region, [aria-hidden="true"]')) continue;
    if (!visible(el)) continue;
    const r = el.getBoundingClientRect();
    if (r.right > w + 1 && !inScroller(el)) { offRight++; if (offList.length < 4) offList.push(describe(el) + ` →${Math.round(r.right)}`); }
    const cs = win.getComputedStyle(el);
    const leaf = el.children.length === 0 && (el.textContent || '').trim().length > 0;
    if (leaf && el.scrollWidth > el.clientWidth + 2 && el.clientWidth > 0 && cs.textOverflow !== 'ellipsis'
        && /(hidden|clip)/.test(cs.overflowX)) { clipped++; if (clipList.length < 4) clipList.push(describe(el)); }
    if (w <= 480 && /^(BUTTON|A|SELECT|INPUT)$/.test(el.tagName) && (r.height < 32 || r.width < 32)
        && el.type !== 'range' && el.type !== 'checkbox' && el.type !== 'radio' && el.type !== 'file') {
      tiny++; if (tinyList.length < 4) tinyList.push(describe(el) + ` ${Math.round(r.width)}x${Math.round(r.height)}`);
    }
  }
  const ctrls = all.filter((el) => /^(BUTTON|SELECT|INPUT|A)$/.test(el.tagName) && visible(el) && el.type !== 'hidden'
    && !el.closest('#yt-holder'));
  for (let i = 0; i < ctrls.length; i++) {
    const a = ctrls[i].getBoundingClientRect();
    for (let j = i + 1; j < ctrls.length; j++) {
      if (ctrls[i].contains(ctrls[j]) || ctrls[j].contains(ctrls[i])) continue;
      const b = ctrls[j].getBoundingClientRect();
      const ox = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      const oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      if (ox > 4 && oy > 4) { overlaps++; if (overList.length < 3) overList.push(describe(ctrls[i]) + ' × ' + describe(ctrls[j])); }
    }
  }
  if (offRight) issues.push(`${offRight} element(s) past the right edge: ${offList.join('; ')}`);
  if (clipped) issues.push(`${clipped} clipped text: ${clipList.join('; ')}`);
  if (overlaps) issues.push(`${overlaps} overlapping controls: ${overList.join('; ')}`);
  if (tiny) issues.push(`${tiny} small touch targets: ${tinyList.join('; ')}`);
  return issues;
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function songId(win) {
  return new Promise((res) => {
    const req = win.indexedDB.open('woodshed');
    req.onsuccess = () => {
      try {
        const q = req.result.transaction('songs').objectStore('songs').getAllKeys();
        q.onsuccess = () => res(q.result.find((k) => k !== 'demo') || 'demo');
        q.onerror = () => res('demo');
      } catch (_) { res('demo'); }
    };
    req.onerror = () => res('demo');
  });
}

async function run() {
  const out = document.getElementById('out');
  const stage = document.getElementById('stage');
  const results = [];
  let total = 0;
  for (const [w, h] of SIZES) {
    const frame = document.createElement('iframe');
    frame.width = w; frame.height = h;
    frame.src = '../index.html#/library';
    stage.replaceChildren(frame);
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    frame.contentWindow.__layoutErrors = [];
    frame.contentWindow.addEventListener('error', (e) => frame.contentWindow.__layoutErrors.push(String(e.message).slice(0, 120)));
    frame.contentWindow.addEventListener('unhandledrejection', (e) => frame.contentWindow.__layoutErrors.push(String(e.reason && e.reason.message || e.reason).slice(0, 120)));
    await wait(900);
    const id = await songId(frame.contentWindow);
    for (const route of ROUTES) {
      const hash = route === 'PLAY' ? `#/song/${id}/play` : route === 'LEARN' ? `#/song/${id}/learn`
        : route === 'SYNC' ? `#/song/${id}/sync` : `#/${route}`;
      frame.contentWindow.location.hash = hash;
      await wait(1300);
      const errs = frame.contentWindow.__layoutErrors || [];
      const issues = audit(frame.contentWindow, w, h).concat(errs.map((e) => 'JS error: ' + e));
      total += issues.length;
      results.push({ size: `${w}x${h}`, route, issues });
      out.textContent = results.map((r) => `${r.size.padEnd(10)} ${r.route.padEnd(9)} ${r.issues.length ? '✗ ' + r.issues.join('\n' + ' '.repeat(23)) : '✓'}`).join('\n');
    }
  }
  out.textContent += `\n\n${total === 0 ? 'ALL CLEAN' : total + ' issue(s)'}`;
  window.__layoutResults = { total, results };
}
run();
</script>
</body>
</html>
